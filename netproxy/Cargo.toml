[package]
name = "netproxy"
version = "1.0.0"
description = "XIGUASecurity network protection local proxy (user-mode)"
edition = "2021"

[[bin]]
name = "netproxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
winreg = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper"] }

[profile.release]
opt-level = 2
lto = true
strip = true
