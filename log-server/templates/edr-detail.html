<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>XIGUASecurity - {{ device.device_name }} EDR 行为链</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-bar acrylic">
        <div class="brand">
            <div class="logo">X</div>
            <span>{{ device.device_name }} - EDR 行为链</span>
        </div>
        <div class="actions">
            <a href="/device/{{ device.device_name }}/edr" class="btn btn-secondary">返回 EDR 列表</a>
            <a href="/device/{{ device.device_name }}" class="btn btn-secondary">返回设备</a>
            <a href="/" class="btn btn-secondary">设备列表</a>
            <a href="/logout" class="btn btn-secondary">退出登录</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
                <div>
                    <h2 class="card-title" style="margin:0;">EDR 行为链拓扑</h2>
                    <p style="margin:4px 0 0 0;color:var(--text-secondary);font-size:13px;">
                        {{ log.summary }} · 时间：{{ log.timestamp }}
                    </p>
                </div>
                <a href="/device/{{ device.device_name }}/edr" class="btn btn-secondary">返回 EDR 列表</a>
            </div>

            <div id="topology-card" class="topology-card">
                <div id="topology-loading" class="topology-loading">加载行为链数据...</div>
                <div id="topology-error" class="topology-error">
                    <div id="err-msg">加载失败</div>
                    <div class="err-detail" id="err-detail"></div>
                </div>

                <div class="header" id="header">
                    <div class="header-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        EDR 行为链拓扑
                    </div>
                    <div class="header-toolbar">
                        <button class="tb-btn" id="btn-plus" title="放大">+</button>
                        <button class="tb-btn" id="btn-minus" title="缩小">−</button>
                        <button class="tb-btn" id="btn-fit" title="适配">⟲</button>
                    </div>
                </div>

                <div class="legend" id="legend">
                    <div class="legend-row"><span class="legend-dot" style="background:#dc2626"></span> 高危行为</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#d97706"></span> 中危行为</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#2563eb"></span> 低危/文件</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#16a34a"></span> 启动</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#dc2626"></span> 终止</div>
                </div>

                <div class="info-card" id="info-card">
                    <div class="title" id="info-title">进程行为链</div>
                    <div class="desc"><strong>EDR 防护已检测到威胁行为</strong>，该进程已被驱动终止。</div>
                    <div class="meta" id="info-meta"></div>
                </div>

                <div class="viewport" id="viewport">
                    <div class="world" id="world">
                        <svg class="links" id="links"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d5db"/></marker></defs></svg>
                        <div class="nodes" id="nodes"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        const rawDetails = {{ log.details | tojson }};
        const edrData = {
            timeline: (rawDetails && rawDetails.behavior) || [],
            process_name: rawDetails ? rawDetails.process_name : '',
            process_path: rawDetails ? rawDetails.process_path : '',
            pid: rawDetails ? rawDetails.pid : 0,
            parent_pid: rawDetails ? rawDetails.parent_pid : 0,
            parent_path: rawDetails ? rawDetails.parent_path : '',
            command_line: rawDetails ? rawDetails.command_line : '',
            total_score: rawDetails ? rawDetails.total_score : 0,
            report_code: rawDetails ? rawDetails.report_code : '',
            threshold: rawDetails ? rawDetails.threshold : 100,
            result: rawDetails ? rawDetails.result : '',
        };

        const icons = {
            start: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
            end: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>',
            file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
            cmd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
            registry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 2.1 10.5"/><path d="M12 12v10"/></svg>',
            inject: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
            memory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8v8H8z"/></svg>',
            thread: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
            image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
            process: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
            unknown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
        };

        const typeMap = {
            '进程创建': { cls: 'low', label: '进程创建', icon: icons.process },
            '创建子进程': { cls: 'low', label: '子进程创建', icon: icons.process },
            'Process Creation': { cls: 'low', label: '进程创建', icon: icons.process },
            'CreateProcess': { cls: 'low', label: '子进程创建', icon: icons.process },
            '创建进程': { cls: 'low', label: '进程创建', icon: icons.process },
            '文件写入': { cls: 'low', label: '文件写入', icon: icons.file },
            'FileWrite': { cls: 'low', label: '文件写入', icon: icons.file },
            '文件删除': { cls: 'high', label: '文件删除', icon: icons.file },
            'FileDelete': { cls: 'high', label: '文件删除', icon: icons.file },
            '注册表修改': { cls: 'med', label: '注册表修改', icon: icons.registry },
            'Registry': { cls: 'med', label: '注册表修改', icon: icons.registry },
            '代码注入': { cls: 'high', label: '代码注入', icon: icons.inject },
            'ProcessInjection': { cls: 'high', label: '代码注入', icon: icons.inject },
            '可疑命令': { cls: 'med', label: '可疑命令', icon: icons.cmd },
            'SuspiciousCmd': { cls: 'med', label: '可疑命令', icon: icons.cmd },
            '内存RWX': { cls: 'high', label: '内存RWX', icon: icons.memory },
            'MemoryRWX': { cls: 'high', label: '内存RWX', icon: icons.memory },
            '远程线程': { cls: 'high', label: '远程线程', icon: icons.thread },
            'RemoteThread': { cls: 'high', label: '远程线程', icon: icons.thread },
            '映像加载': { cls: 'med', label: '映像加载', icon: icons.image },
            'ImageLoad': { cls: 'med', label: '映像加载', icon: icons.image }
        };

        const NODE_HALF_W = 85;
        let scale = 1, offsetX = 0, offsetY = 0;
        let isDragging = false, startX, startY, startOX, startOY;
        let nodeData = [], linkData = [];

        function getTypeInfo(typeCn, typeEn) {
            return typeMap[typeCn] || typeMap[typeEn] || { cls: 'med', label: typeCn || typeEn || '行为', icon: icons.unknown };
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function formatDetail(detail) {
            if (!detail) return '';
            let s = String(detail).trim();
            if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) s = s.slice(1, -1);
            return s;
        }

        function extractChildPid(detail) {
            const s = String(detail || '');
            const m1 = s.match(/RunChild:.*\(PID[:\s]*(\d+)\)/i);
            if (m1) return parseInt(m1[1], 10);
            const m2 = s.match(/ChildPID[:\s]*(\d+)/i);
            if (m2) return parseInt(m2[1], 10);
            return null;
        }

        function extractChildPath(detail) {
            let s = String(detail || '');
            if (s.toLowerCase().startsWith('childpid:')) {
                const parts = s.split(',');
                if (parts.length > 1) return parts.slice(1).join(',').trim();
                return s.replace(/ChildPID[:\s]*\d+/i, '').trim();
            }
            s = s.replace(/^RunChild:/i, '').trim();
            const m = s.match(/\(PID[:\s]*\d+\)/i);
            if (m) s = s.replace(m[0], '').replace(/[()]/g, '').trim();
            return s;
        }

        function basename(path) {
            if (!path) return '';
            return String(path).replace(/\\/g, '/').split('/').pop() || '';
        }

        function buildTopology(data) {
            nodeData = []; linkData = [];
            const rawEvents = data.timeline || [];

            const events = [];
            const seen = new Map();
            rawEvents.forEach((ev, idx) => {
                const info = getTypeInfo(ev.type_cn, ev.type_en);
                if (info.label !== '可疑命令') {
                    events.push(ev);
                    return;
                }
                const sec = String(ev.relative_sec || '0');
                const core = formatDetail(ev.detail).replace(/^ChildPID:\d+\|/i, '').trim();
                const key = `${sec}|${core}`;
                const hasPid = /^ChildPID:\d+\|/i.test(String(ev.detail || ''));
                if (seen.has(key)) {
                    const prev = seen.get(key);
                    if (hasPid && !prev.hasPid) {
                        events[prev.index] = ev;
                        prev.hasPid = true;
                    }
                } else {
                    seen.set(key, { hasPid, index: events.length });
                    events.push(ev);
                }
            });

            const LEVEL_GAP_X = 240;
            const NODE_GAP_Y = Math.min(110, Math.max(60, 60 + Math.ceil((events.length - 5) / 5) * 16));
            const ROOT_X = 0;
            const ROOT_Y = 0;

            const hasParent = data.parent_path && data.parent_path !== 'N/A';
            const parentName = hasParent ? basename(data.parent_path) : (data.process_name || '进程');
            const rootNode = {
                id: 'root', x: ROOT_X, y: ROOT_Y,
                cls: 'root', icon: icons.start,
                title: escapeHtml(parentName || '进程'),
                meta: hasParent ? `父进程 PID ${data.parent_pid || 0}` : '进程启动',
                detail: escapeHtml(data.parent_path && data.parent_path !== 'N/A' ? data.parent_path : (data.command_line || '命令行未记录')),
                code: ''
            };
            nodeData.push(rootNode);

            const currentNode = {
                id: 'current',
                parentId: 'root',
                x: 0, y: 0,
                cls: 'low',
                icon: icons.process,
                title: escapeHtml(data.process_name || '当前进程'),
                meta: `PID ${data.pid || 0}`,
                detail: escapeHtml(data.command_line && data.command_line !== 'N/A' ? data.command_line : '命令行未记录'),
                code: '',
                children: []
            };
            nodeData.push(currentNode);
            linkData.push({ from: 'root', to: 'current', cls: 'low' });

            const childProcMap = {};
            let lastChildPid = null;
            events.forEach((ev, idx) => {
                const info = getTypeInfo(ev.type_cn, ev.type_en);
                const pid = extractChildPid(ev.detail);
                const isChildCreate = info.label === '子进程创建' || info.label === '进程创建' || ev.type_en === 'CreateProcess';
                if (isChildCreate && pid && pid !== data.pid) {
                    if (!childProcMap[pid]) {
                        const pathText = extractChildPath(ev.detail);
                        const fname = basename(pathText) || '子进程';
                        const childNode = {
                            id: `child_${pid}`,
                            parentId: 'current',
                            x: 0, y: 0,
                            cls: info.cls,
                            icon: icons.process,
                            title: escapeHtml(fname),
                            meta: `子进程 PID ${pid}`,
                            detail: escapeHtml(pathText || ev.detail || ''),
                            code: escapeHtml(ev.code || ''),
                            time: escapeHtml(ev.datetime || ''),
                            childPid: pid,
                            fname: fname.toLowerCase(),
                            children: []
                        };
                        childProcMap[pid] = childNode;
                        nodeData.push(childNode);
                        linkData.push({ from: 'current', to: childNode.id, cls: childNode.cls });
                        currentNode.children.push(childNode);
                        lastChildPid = pid;
                    }
                }
            });

            events.forEach((ev, idx) => {
                const info = getTypeInfo(ev.type_cn, ev.type_en);
                const pid = extractChildPid(ev.detail);

                if (info.label === '子进程创建' || info.label === '进程创建' || ev.type_en === 'CreateProcess') return;

                let parentId = 'current';
                let parentNode = currentNode;

                if (pid && childProcMap[pid]) {
                    parentId = `child_${pid}`;
                    parentNode = childProcMap[pid];
                } else if (lastChildPid && info.label === '可疑命令') {
                    const detailText = formatDetail(ev.detail).toLowerCase();
                    const lastChild = childProcMap[lastChildPid];
                    if (lastChild && lastChild.fname && detailText.includes(lastChild.fname.replace('.exe', ''))) {
                        parentId = `child_${lastChildPid}`;
                        parentNode = lastChild;
                    }
                }

                const node = {
                    id: `event_${idx}`,
                    parentId,
                    x: 0, y: 0,
                    cls: info.cls,
                    icon: info.icon,
                    title: escapeHtml(info.label),
                    meta: `步骤 ${idx + 1} · +${escapeHtml(ev.relative_sec || '0s')}`,
                    detail: escapeHtml(formatDetail(ev.detail) || '无详细描述'),
                    code: escapeHtml(ev.code || ''),
                    time: escapeHtml(ev.datetime || ''),
                    children: []
                };
                nodeData.push(node);
                linkData.push({ from: parentId, to: node.id, cls: node.cls });
                parentNode.children.push(node);
            });

            const endNode = {
                id: 'end',
                x: 0, y: 0,
                cls: 'end', icon: icons.end, title: '进程已终止',
                meta: 'EDR 已拦截威胁',
                detail: `威胁评分 ${data.total_score || 0} / 100，驱动已自动终止该进程`,
                code: ''
            };
            nodeData.push(endNode);

            const leafNodes = nodeData.filter(n => n.id !== 'root' && n.id !== 'end' && (!n.children || n.children.length === 0));
            if (leafNodes.length === 0) {
                linkData.push({ from: 'current', to: 'end', cls: 'end' });
            } else {
                leafNodes.forEach(leaf => {
                    linkData.push({ from: leaf.id, to: 'end', cls: 'end' });
                });
            }

            function layoutTree(parentNode, depth) {
                const children = nodeData.filter(n => n.parentId === parentNode.id);
                children.sort((a, b) => String(a.id).localeCompare(String(b.id)));

                const totalHeight = (children.length - 1) * NODE_GAP_Y;
                let startY = parentNode.y - totalHeight / 2;
                children.forEach((child, i) => {
                    child.y = startY + i * NODE_GAP_Y;
                    child.x = ROOT_X + (depth + 1) * LEVEL_GAP_X;
                    layoutTree(child, depth + 1);
                });
            }

            layoutTree(rootNode, 0);

            function getDescendants(nodeId) {
                const result = [];
                nodeData.filter(n => n.parentId === nodeId).forEach(child => {
                    result.push(child);
                    result.push(...getDescendants(child.id));
                });
                return result;
            }

            function resolveOverlaps() {
                const nonEndNodes = nodeData.filter(n => n.id !== 'end');
                const colThreshold = 10;
                const overlapThreshold = 55;
                const minGap = 60;
                let changed = true;
                while (changed) {
                    changed = false;
                    for (let i = 0; i < nonEndNodes.length; i++) {
                        for (let j = 0; j < nonEndNodes.length; j++) {
                            if (i === j) continue;
                            const a = nonEndNodes[i], b = nonEndNodes[j];
                            if (Math.abs(a.x - b.x) > colThreshold) continue;
                            if (b.y > a.y && b.y - a.y < overlapThreshold) {
                                const delta = minGap - (b.y - a.y);
                                b.y += delta;
                                getDescendants(b.id).forEach(d => d.y += delta);
                                changed = true;
                            }
                        }
                    }
                }
            }

            resolveOverlaps();

            endNode.x = ROOT_X + 4 * LEVEL_GAP_X;
            if (leafNodes.length > 0) {
                const ys = leafNodes.map(n => n.y).sort((a, b) => a - b);
                endNode.y = ys[Math.floor(ys.length / 2)];
            } else {
                endNode.y = ROOT_Y;
            }

            if (events.length <= 2) {
                rootNode.y = 0;
                currentNode.y = 0;
                endNode.y = 0;
            }
        }

        function renderNodes() {
            const container = document.getElementById('nodes');
            container.innerHTML = '';
            nodeData.forEach(node => {
                const el = document.createElement('div');
                el.className = `node ${node.cls}`;
                el.id = 'node-' + node.id;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                el.innerHTML = `
                    <div class="row">
                        <div class="icon">${node.icon}</div>
                        <div>
                            <div class="title">${node.title}</div>
                            <div class="meta">${node.meta}</div>
                        </div>
                    </div>
                `;
                el.addEventListener('mouseenter', e => showTooltip(e, node));
                el.addEventListener('mouseleave', () => hideTooltip());
                el.addEventListener('mousemove', e => moveTooltip(e));
                container.appendChild(el);
            });
        }

        function showTooltip(e, node) {
            const tooltip = document.getElementById('tooltip');
            const time = node.time ? `<div class="time">${node.time}</div>` : '';
            const code = node.code ? `<div class="code">${node.code}</div>` : '';
            tooltip.innerHTML = `${time}<div>${escapeHtml(node.detail || '')}</div>${code}`;
            tooltip.style.display = 'block';
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const tooltip = document.getElementById('tooltip');
            const pad = 12;
            let x = e.clientX + pad, y = e.clientY + pad;
            const vw = window.innerWidth, vh = window.innerHeight;
            if (x + tooltip.offsetWidth > vw) x = e.clientX - tooltip.offsetWidth - pad;
            if (y + tooltip.offsetHeight > vh) y = e.clientY - tooltip.offsetHeight - pad;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        function renderLinks() {
            const svg = document.getElementById('links');
            svg.innerHTML = `
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d5db"/></marker>
                    <marker id="arrow-high" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
                    <marker id="arrow-med" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
                    <marker id="arrow-low" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
                </defs>
            `;

            const nodeMap = {};
            nodeData.forEach(n => nodeMap[n.id] = n);

            linkData.forEach(link => {
                const from = nodeMap[link.from];
                const to = nodeMap[link.to];
                if (!from || !to) return;

                const x1 = from.x + 85;
                const y1 = from.y;
                const x2 = to.x - 85;
                const y2 = to.y;
                const c1x = x1 + (x2 - x1) * 0.5;
                const c2x = x2 - (x2 - x1) * 0.5;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`);
                path.setAttribute('class', link.cls || '');
                path.setAttribute('stroke', link.cls === 'high' ? '#dc2626' : link.cls === 'med' ? '#d97706' : link.cls === 'low' ? '#2563eb' : '#9ca3af');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('fill', 'none');
                path.setAttribute('marker-end', `url(#arrow${link.cls && link.cls !== 'end' && link.cls !== 'root' ? '-' + link.cls : ''})`);
                svg.appendChild(path);
            });
        }

        function updateWorld() {
            document.getElementById('world').style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        }

        function fitTopology() {
            const viewport = document.getElementById('viewport');
            const vw = viewport.clientWidth, vh = viewport.clientHeight;
            const minX = Math.min(...nodeData.map(n => n.x - NODE_HALF_W));
            const maxX = Math.max(...nodeData.map(n => n.x + NODE_HALF_W));
            const minY = Math.min(...nodeData.map(n => n.y - 40));
            const maxY = Math.max(...nodeData.map(n => n.y + 40));
            const contentW = Math.max(maxX - minX, 400);
            const contentH = Math.max(maxY - minY, 300);
            scale = Math.min(1, (vw - 120) / contentW, (vh - 120) / contentH);
            offsetX = (vw - (minX + maxX) * scale) / 2;
            offsetY = (vh - (minY + maxY) * scale) / 2;
            updateWorld();
        }

        function initEvents() {
            const viewport = document.getElementById('viewport');
            viewport.addEventListener('mousedown', e => {
                if (e.target.closest('.node') || e.target.closest('.tooltip')) return;
                isDragging = true; startX = e.clientX; startY = e.clientY; startOX = offsetX; startOY = offsetY;
            });
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                offsetX = startOX + (e.clientX - startX);
                offsetY = startOY + (e.clientY - startY);
                updateWorld();
            });
            window.addEventListener('mouseup', () => isDragging = false);
            viewport.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = viewport.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                const factor = e.deltaY > 0 ? 0.9 : 1.1;
                const ns = Math.max(0.3, Math.min(2.5, scale * factor));
                offsetX = mx - (mx - offsetX) * (ns / scale);
                offsetY = my - (my - offsetY) * (ns / scale);
                scale = ns; updateWorld();
            }, { passive: false });

            document.getElementById('btn-plus').addEventListener('click', () => zoom(1.2));
            document.getElementById('btn-minus').addEventListener('click', () => zoom(0.8));
            document.getElementById('btn-fit').addEventListener('click', () => fitTopology());
        }

        function zoom(factor) {
            const viewport = document.getElementById('viewport');
            const mx = viewport.clientWidth / 2, my = viewport.clientHeight / 2;
            const ns = Math.max(0.3, Math.min(2.5, scale * factor));
            offsetX = mx - (mx - offsetX) * (ns / scale);
            offsetY = my - (my - offsetY) * (ns / scale);
            scale = ns; updateWorld();
        }

        function loadData() {
            if (!edrData.timeline || edrData.timeline.length === 0) {
                showError('报告数据中没有行为时间线', '');
                return;
            }

            document.getElementById('topology-loading').style.display = 'none';
            document.getElementById('header').style.display = 'flex';
            document.getElementById('legend').style.display = 'block';
            document.getElementById('info-card').style.display = 'block';

            document.getElementById('info-title').textContent = (edrData.process_name || '进程') + ' 行为链拓扑';
            document.getElementById('info-meta').textContent = `PID: ${edrData.pid || 0} · 报告编号: ${edrData.report_code || ''} · 威胁评分: ${edrData.total_score || 0}`;

            buildTopology(edrData);
            renderNodes();
            renderLinks();
            fitTopology();
        }

        function showError(msg, detail) {
            document.getElementById('topology-loading').style.display = 'none';
            document.getElementById('topology-error').style.display = 'flex';
            document.getElementById('err-msg').textContent = msg;
            document.getElementById('err-detail').textContent = detail || '';
        }

        document.addEventListener('DOMContentLoaded', () => { initEvents(); loadData(); });
    </script>
</body>
</html>
