<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-engineered Threat Engine Component</title>
<style>
  :root {
    --bg: #ffffff;
    --text-primary: #1a1a1a;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --border: #e5e7eb;
    --accent: #3b82f6;
    --card-bg: #f9fafb;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0f0f0f;
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-tertiary: #6b7280;
    --border: #374151;
    --accent: #60a5fa;
    --card-bg: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
    transition: background 0.3s, color 0.3s;
  }
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-primary);
    transition: all 0.2s;
  }
  .theme-toggle:hover { opacity: 0.8; }
  .showcase {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
    width: 100%;
    max-width: 600px;
  }
  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
    font-weight: 500;
  }
  /* === THE COMPONENT === */
  .threat-engine {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-family: var(--font-sans);
    transition: background 0.3s, border-color 0.3s;
  }
  .threat-engine__icons {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .threat-engine__icon {
    width: 40px;
    height: 40px;
    object-fit: contain;
    display: block;
  }
  .threat-engine__cross {
    font-size: 14px;
    font-weight: 400;
    color: var(--accent);
    line-height: 1;
    user-select: none;
  }
  .threat-engine__divider {
    width: 1px;
    height: 36px;
    background: var(--border);
    flex-shrink: 0;
  }
  .threat-engine__text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .threat-engine__title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .threat-engine__subtitle {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  /* Variants */
  .threat-engine--ghost {
    background: transparent;
    border: none;
    padding: 8px 0;
  }
  .threat-engine--ghost .threat-engine__divider {
    background: var(--border);
  }
  /* Inline usage demo */
  .demo-card {
    width: 100%;
    max-width: 480px;
    padding: 24px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .demo-card h3 {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 16px;
    color: var(--text-primary);
  }
  .demo-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .demo-row:last-child { border-bottom: none; }
  .demo-row span { color: var(--text-secondary); font-size: 14px; }
</style>
</head>
