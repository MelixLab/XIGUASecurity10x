[package]
name = "XIGUASecurity"
version = "10.2.35"
description = "A modern antivirus security application"
authors = ["you"]
edition = "2021"

[lib]
name = "xiguasecurity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
ms_store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros"] }
lazy_static = "1.4"
once_cell = "1.19"
walkdir = "2"
rayon = "1.8"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"] }
ureq = { version = "2", features = ["json"] }
futures-util = "0.3"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
urlencoding = "2.1"
encoding = "0.2"
regex = "1.10"
base64 = "0.22"
goblin = "0.9"
lzma-rs = "0.3"
zip = "2"
sevenz-rust = "0.6"
winreg = "0.52"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Time", "Win32_System_Registry", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Wmi", "Win32_System_Ole", "Win32_System_RestartManager", "Win32_NetworkManagement_IpHelper", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
wmi = "0.14"
