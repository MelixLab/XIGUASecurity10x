<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antivirus Security</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app"></div>

    <!-- 液态玻璃 SVG 滤镜定义（feTurbulence 噪声 + feDisplacementMap 扭曲，模拟玻璃折射） -->
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
      <defs>
        <filter id="lg-dist" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015" numOctaves="2" seed="92" result="noise" />
          <feGaussianBlur in="noise" result="blurred" stdDeviation="1.5" />
          <feDisplacementMap in="SourceGraphic" in2="blurred" scale="24" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="lg-dist-strong" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="92" result="noise" />
          <feGaussianBlur in="noise" result="blurred" stdDeviation="2" />
          <feDisplacementMap in="SourceGraphic" in2="blurred" scale="42" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
  </body>
</html>
