<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发现活动内存的威胁</title>
    <link rel="stylesheet" href="intercept-theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .alert-container {
            width: 100%;
            height: 100%;
            padding: 16px 18px 14px;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: background .15s, color .15s;
            z-index: 20;
        }
        .close-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .close-btn svg { width: 14px; height: 14px; }
        .drag-region {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 32px;
            -webkit-app-region: drag;
            app-region: drag;
            z-index: 10;
        }

        /* 头部：警示图标 + 大标题 */
        .alert-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 2px;
        }
        .warning-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .warning-icon svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .title-block { flex: 1; min-width: 0; }
        .main-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .threat-name {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 解释说明（黄色警告条） */
        .description-box {
            background: rgba(255, 167, 38, 0.12);
            border-left: 3px solid var(--warning);
            border-radius: 0 4px 4px 0;
            padding: 9px 12px;
            margin-top: 12px;
        }
        .description-text {
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* 文件路径 */
        .file-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-top: 10px;
            font-size: 11.5px;
        }
        .file-label { color: var(--text-tertiary); white-space: nowrap; flex-shrink: 0; }
        .file-value {
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            direction: rtl;
            text-align: left;
        }

        /* 竖排双按钮（按钮文案较长，必须上下排列） */
        .alert-actions {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background .15s;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
            height: 44px;
        }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-title { font-size: 13px; font-weight: 600; }
        .btn-desc { font-size: 11px; opacity: .85; line-height: 1.3; }
        .btn-boot {
            background: var(--danger);
            color: #fff;
        }
        .btn-boot:hover:not(:disabled) { background: var(--danger-hover, #c82333); }
        .btn-live {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-live:hover:not(:disabled) { background: var(--bg-hover); }

        /* 状态提示行 */
        .status-line {
            margin-top: 8px;
            font-size: 11.5px;
            color: var(--text-secondary);
            min-height: 16px;
            line-height: 1.4;
            text-align: center;
        }
        .status-line.error { color: var(--danger); }
        .status-line.success { color: var(--success); }
    </style>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'blue';
            var themeMode = localStorage.getItem('themeMode') || 'colorful';
            var backdrop = localStorage.getItem('windowBackdrop') || 'none';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-theme-mode', themeMode);
            document.documentElement.setAttribute('data-backdrop', backdrop);
        })();
        document.addEventListener('DOMContentLoaded', function() {
            var listen = window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen;
            if (listen) {
                listen('theme-changed', function(event) {
                    var d = event.payload || {};
                    if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
                    if (d.themeMode) document.documentElement.setAttribute('data-theme-mode', d.themeMode);
                });
            }
        });
    </script>
</head>
<body>
    <div class="drag-region"></div>
    <div class="alert-container">
        <button class="close-btn" id="btn-close" title="关闭">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>

        <div class="alert-header">
            <div class="warning-icon">
                <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
            </div>
            <div class="title-block">
                <div class="main-title" data-i18n="activeThreatTitle">发现活动内存的威胁</div>
                <div class="threat-name" id="threat-name">--</div>
            </div>
        </div>

        <div class="description-box">
            <div class="description-text" data-i18n="activeThreatDesc">西瓜杀毒已发现活动型病毒威胁，尝试清除但清除失败。我们建议您保存未保存的工作，并且单击“开机时清除”完全清除威胁。或者尝试“不重启而清除”。但可能存在风险。</div>
        </div>

        <div class="file-row">
            <span class="file-label" data-i18n="activeThreatFile">文件</span>
            <span class="file-value" id="file-path">--</span>
        </div>

        <div class="alert-actions">
            <button class="btn btn-boot" id="btn-boot">
                <span class="btn-title" data-i18n="activeThreatBootTitle">开机时清除</span>
                <span class="btn-desc" data-i18n="activeThreatBootDesc">重启系统后彻底删除该文件</span>
            </button>
            <button class="btn btn-live" id="btn-live">
                <span class="btn-title" data-i18n="activeThreatLiveTitle">不重启而清除</span>
                <span class="btn-desc" data-i18n="activeThreatLiveDesc">结束占用进程并立即删除，存在一定风险</span>
            </button>
        </div>

        <div class="status-line" id="status-line"></div>
    </div>

    <script>
        const translations = {
            'zh-CN': {
                activeThreatTitle: '发现活动内存的威胁',
                activeThreatDesc: '西瓜杀毒已发现活动型病毒威胁，尝试清除但清除失败。我们建议您保存未保存的工作，并且单击“开机时清除”完全清除威胁。或者尝试“不重启而清除”。但可能存在风险。',
                activeThreatFile: '文件',
                activeThreatBootTitle: '开机时清除',
                activeThreatBootDesc: '重启系统后彻底删除该文件',
                activeThreatLiveTitle: '不重启而清除',
                activeThreatLiveDesc: '结束占用进程并立即删除，存在一定风险',
                activeThreatWorking: '正在处理，请稍候…',
                activeThreatBootScheduled: '已标记为开机时清除，正在准备重启倒计时…',
                activeThreatLiveKilling: '正在结束占用该文件的进程…',
                activeThreatLiveDone: '威胁已清除',
                activeThreatLivePartial: '部分占用进程已结束，文件已删除',
                activeThreatFail: '操作失败：{msg}',
                activeThreatClose: '关闭'
            },
            'zh-TW': {
                activeThreatTitle: '發現活動記憶體的威脅',
                activeThreatDesc: '西瓜防毒已發現活動型病毒威脅，嘗試清除但清除失敗。我們建議您儲存未儲存的工作，並且按一下「開機時清除」完全清除威脅。或者嘗試「不重新啟動而清除」。但可能存在風險。',
                activeThreatFile: '檔案',
                activeThreatBootTitle: '開機時清除',
                activeThreatBootDesc: '重新啟動系統後徹底刪除該檔案',
                activeThreatLiveTitle: '不重新啟動而清除',
                activeThreatLiveDesc: '結束佔用程序並立即刪除，存在一定風險',
                activeThreatWorking: '正在處理，請稍候…',
                activeThreatBootScheduled: '已標記為開機時清除，正在準備重新啟動倒數…',
                activeThreatLiveKilling: '正在結束佔用該檔案的程序…',
                activeThreatLiveDone: '威脅已清除',
                activeThreatLivePartial: '部分佔用程序已結束，檔案已刪除',
                activeThreatFail: '操作失敗：{msg}',
                activeThreatClose: '關閉'
            },
            'en-US': {
                activeThreatTitle: 'Active Threat Detected',
                activeThreatDesc: 'Xigua Antivirus detected an active memory threat. The attempt to remove it failed. We recommend saving your work and clicking "Remove on restart" to completely remove the threat. Alternatively, you can try "Remove without restart", but this may carry some risk.',
                activeThreatFile: 'File',
                activeThreatBootTitle: 'Remove on restart',
                activeThreatBootDesc: 'Permanently deletes the file after a system restart',
                activeThreatLiveTitle: 'Remove without restart',
                activeThreatLiveDesc: 'Terminates the locking process and deletes now; some risk',
                activeThreatWorking: 'Working, please wait…',
                activeThreatBootScheduled: 'Scheduled for removal on restart. Preparing restart countdown…',
                activeThreatLiveKilling: 'Terminating processes that lock this file…',
                activeThreatLiveDone: 'Threat removed',
                activeThreatLivePartial: 'Locking processes terminated, file deleted',
                activeThreatFail: 'Operation failed: {msg}',
                activeThreatClose: 'Close'
            }
        };

        const params = new URLSearchParams(window.location.search);

        function safeGet(key) {
            try { return params.get(key) || ''; } catch (e) { return ''; }
        }

        // 预创建窗口的 URL 无 lang 参数，运行时从后端拉取当前语言
        let currentLang = ['zh-CN', 'zh-TW', 'en-US'].includes(safeGet('lang')) ? safeGet('lang') : '';

        function t(key, replacements) {
            const base = currentLang || 'zh-CN';
            let text = translations[base]?.[key] ?? translations['zh-CN']?.[key] ?? key;
            if (replacements) {
                Object.entries(replacements).forEach(([k, v]) => {
                    text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), String(v));
                });
            }
            return text;
        }

        function applyI18n() {
            document.title = t('activeThreatTitle');
            document.documentElement.lang = currentLang || 'zh-CN';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key) el.textContent = t(key);
            });
        }

        function normalizeWinPath(p) {
            return typeof p === 'string' ? p.replace(/\//g, '\\') : p;
        }

        let threatData = null;
        let busy = false;
        // 成功清除后的自动关闭定时器（新威胁到来时必须取消，避免误关新弹窗）
        let closeTimer = null;

        function setStatus(text, kind) {
            const el = document.getElementById('status-line');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'status-line' + (kind ? ' ' + kind : '');
        }

        function updateContent(data) {
            // ★新威胁到来：重置界面状态★
            // 预创建窗口会被复用，上一次清除操作留下的 busy/状态行/自动关闭定时器
            // 必须在此清空，否则第二次弹窗会残留"已清除"提示且按钮全部禁用。
            if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
            setBusy(false);
            setStatus('', '');
            threatData = data;
            const rawPath = data.filePath || '--';
            const filePath = normalizeWinPath(rawPath);
            document.getElementById('threat-name').textContent = data.threatName || '--';
            document.getElementById('file-path').textContent = filePath;
            document.getElementById('file-path').title = filePath;
        }

        function setBusy(b) {
            busy = b;
            document.getElementById('btn-boot').disabled = b;
            document.getElementById('btn-live').disabled = b;
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 拉取当前语言后应用国际化文案（预创建窗口 URL 无 lang 参数）
            const applyLang = () => {
                if (window.__TAURI__ && window.__TAURI__.core) {
                    window.__TAURI__.core.invoke('get_current_language')
                        .then((lang) => {
                            if (lang && ['zh-CN', 'zh-TW', 'en-US'].includes(lang)) currentLang = lang;
                            applyI18n();
                        })
                        .catch(() => {
                            if (!currentLang) currentLang = 'zh-CN';
                            applyI18n();
                        });
                } else {
                    if (!currentLang) currentLang = 'zh-CN';
                    applyI18n();
                }
            };
            applyLang();

            // 注册 Tauri 事件监听（线程安全，替代 postMessage）
            if (window.__TAURI__ && window.__TAURI__.event) {
                (async () => {
                    try {
                        await window.__TAURI__.event.listen('active-threat-data', (event) => {
                            updateContent(event.payload);
                        });
                    } catch (e) {
                        console.warn('[ActiveThreat] Failed to register listener:', e);
                    }
                })();
            }

            // 从 URL 参数读取初始数据
            try {
                const fp = safeGet('filePath');
                if (fp) {
                    updateContent({
                        filePath: fp,
                        fileName: safeGet('fileName') || undefined,
                        threatName: safeGet('threatName') || undefined
                    });
                }
            } catch (e) {}

            // 兜底：拉取后端缓存的最近一次数据
            function refetchPending() {
                if (!window.__TAURI__ || !window.__TAURI__.core) return;
                window.__TAURI__.core.invoke('get_pending_active_threat_data')
                    .then((pending) => {
                        if (pending && pending.filePath) {
                            console.log('[ActiveThreat] Refetched pending data:', pending);
                            updateContent(pending);
                        }
                    })
                    .catch(() => {});
            }
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) refetchPending();
            });
            window.addEventListener('focus', refetchPending);

            document.getElementById('btn-close')?.addEventListener('click', async function() {
                try {
                    if (window.__TAURI__ && window.__TAURI__.core) {
                        await window.__TAURI__.core.invoke('close_active_threat_alert_window');
                    } else { window.close(); }
                } catch (e) { window.close(); }
            });

            // 开机时清除：标记下次重启删除 → 弹出 60 秒重启倒计时
            document.getElementById('btn-boot')?.addEventListener('click', async function() {
                if (busy || !threatData) return;
                setBusy(true);
                setStatus(t('activeThreatWorking'), '');
                try {
                    if (window.__TAURI__ && window.__TAURI__.core) {
                        await window.__TAURI__.core.invoke('schedule_boot_cleanup_command', {
                            filePath: threatData.filePath
                        });
                        setStatus(t('activeThreatBootScheduled'), 'success');
                        // 关闭处置窗口，弹出重启倒计时窗口
                        await window.__TAURI__.core.invoke('close_active_threat_alert_window');
                        await window.__TAURI__.core.invoke('show_reboot_countdown');
                    }
                } catch (e) {
                    console.error('[ActiveThreat] Boot cleanup failed:', e);
                    setStatus(t('activeThreatFail', { msg: (e && e.message) || e }), 'error');
                    setBusy(false);
                }
            });

            // 不重启而清除：结束占用进程 → 重试删除
            document.getElementById('btn-live')?.addEventListener('click', async function() {
                if (busy || !threatData) return;
                setBusy(true);
                setStatus(t('activeThreatLiveKilling'), '');
                try {
                    if (window.__TAURI__ && window.__TAURI__.core) {
                        const result = await window.__TAURI__.core.invoke('clear_without_restart_command', {
                            filePath: threatData.filePath
                        });
                        const killedCount = (result && result.killed_pids) ? result.killed_pids.length : 0;
                        console.log('[ActiveThreat] Cleared without restart, killed pids:', result && result.killed_pids);
                        setStatus(killedCount > 0 ? t('activeThreatLivePartial') : t('activeThreatLiveDone'), 'success');
                        // 短暂展示结果后关闭窗口（存入 closeTimer，新威胁到来时会被取消）
                        closeTimer = setTimeout(async function() {
                            try {
                                await window.__TAURI__.core.invoke('close_active_threat_alert_window');
                            } catch (e) {}
                        }, 1600);
                    }
                } catch (e) {
                    console.error('[ActiveThreat] Live clear failed:', e);
                    setStatus(t('activeThreatFail', { msg: (e && e.message) || e }), 'error');
                    setBusy(false);
                }
            });
        });
    </script>
</body>
</html>
