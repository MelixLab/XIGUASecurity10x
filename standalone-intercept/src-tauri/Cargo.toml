[package]
name = "xigua-intercept"
version = "10.2.20"
description = "XIGUA Security - Standalone Suspicious File Intercept"
authors = ["XIGUA Security"]
edition = "2021"

[lib]
name = "xigua_intercept_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
urlencoding = "2.1"
ort = { version = "2.0.0-rc.9", features = ["ndarray", "download-binaries"] }
ndarray = { version = "0.17" }
lazy_static = "1.4"
once_cell = "1.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
] }
